<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="cartItems.length > 0; else emptyCart">
    <ion-item *ngFor="let item of cartItems; let i = index">
      <ion-thumbnail slot="start">
        <img [src]="item.image" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.title }}</h2>
        <p>{{ item.price | currency:'USD' }}</p>
      </ion-label>
      <ion-button fill="clear" color="danger" (click)="removeItem(i)">
        Quitar
      </ion-button>
    </ion-item>
  </ion-list>

  <ng-template #emptyCart>
    <p>El carrito está vacío 🛒</p>
  </ng-template>

  <ion-card *ngIf="cartItems.length > 0">
    <ion-card-header>
      <ion-card-title>Total: {{ total | currency:'USD' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-button expand="block" color="danger" (click)="clearCart()">Vaciar Carrito</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
