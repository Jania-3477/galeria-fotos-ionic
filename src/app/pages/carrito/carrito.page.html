<ion-header>
  <ion-toolbar>
    <ion-title>Carrito de Compras</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let item of carrito">
      <ion-thumbnail slot="start">
        <img [src]="item.imagen">
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.nombre }}</h2>
        <p>{{ item.precio | currency:'USD' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-label>Total:</ion-label>
    <ion-note slot="end">{{ total | currency:'USD' }}</ion-note>
  </ion-item>

  <ion-button expand="block" color="danger" (click)="vaciarCarrito()">
    Vaciar Carrito
  </ion-button>

</ion-content>
