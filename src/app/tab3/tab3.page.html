<ion-header>
  <ion-toolbar>
    <ion-title>Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of cart; let i = index">
      <ion-label>
        <h2>{{item.title}}</h2>
        <p>\${{item.price}}</p>
      </ion-label>
      <ion-button color="danger" slot="end" (click)="removeItem(i)">Eliminar</ion-button>
    </ion-item>
  </ion-list>

  <ion-button expand="full" color="medium" (click)="clearCart()">Vaciar carrito</ion-button>
</ion-content>
