<ion-header>
  <ion-toolbar>
    <ion-title>Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let producto of carrito">
      <ion-label>
        <h2>{{ producto.nombre }}</h2>
        <p>{{ producto.precio | currency:'USD' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
