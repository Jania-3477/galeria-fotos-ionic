<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()"><ion-icon name="close"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Foto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="photo-full">
  <div class="image-wrap">
    <img [src]="photo.webviewPath" alt="Foto ampliada" />
  </div>
</ion-content>
