<ion-header>
  <ion-toolbar>
    <ion-title>Productos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="verCarrito()">
        Carrito ({{ carrito.length }})
      </ion-button>
      <ion-button (click)="irAGaleria()">Galería</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let producto of productos">
      <ion-thumbnail slot="start">
        <img [src]="producto.imagen">
      </ion-thumbnail>
      <ion-label>
        <h2>{{ producto.nombre }}</h2>
        <p>{{ producto.precio | currency:'USD' }}</p>
      </ion-label>
      <ion-button slot="end" color="primary" (click)="agregarAlCarrito(producto)">
        Agregar
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
